# IP-only: no nginx/SSL. App on :80, API on :8000.
# Usage: docker compose -f docker-compose.ip.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vitobet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vitobet}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vitobet} -d ${POSTGRES_DB:-vitobet}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vitobet}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vitobet}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET}
      PRIZE_POOL_LABEL: ${PRIZE_POOL_LABEL:-Vitobet Pool 2026}
      PRIZE_POOL_AMOUNT_USD: ${PRIZE_POOL_AMOUNT_USD:-—}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    restart: unless-stopped
    ports:
      - "80:3000"
    depends_on:
      - backend

  cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          curl -sf -X POST -H "X-Cron-Secret: $$CRON_SECRET" http://backend:8000/jobs/run || true
          sleep 900
        done
    depends_on:
      - backend

volumes:
  pgdata:
